name: Validate Training Lab site

# GitHub Pages is not enabled on this repo (deploy-pages → 404).
# Validate the static site on push/PR instead of failing deploy.

on:
  push:
    branches:
      - main
      - cursor/training-canvas-anatomy-5c6f
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site bundle
        run: |
          mkdir -p deploy
          cp index.html canvas.html anatomy.html deploy/
          cp -r css js data assets deploy/
          touch deploy/.nojekyll
          test -f deploy/canvas.html
          test -f deploy/js/canvas.js
          test -f deploy/js/charts.js
          test -d deploy/data
          test -f deploy/data/sessions/gym-log.json
          test -f deploy/data/album-inventory.json
          ls -la deploy

      - name: Validate JSON data files
        run: |
          python3 << 'PY'
          import json, sys
          from pathlib import Path
          root = Path('deploy/data')
          files = list(root.rglob('*.json'))
          if not files:
              print('No JSON files found', file=sys.stderr)
              sys.exit(1)
          for path in sorted(files):
              with path.open() as f:
                  json.load(f)
              print('OK', path)
          print(f'Validated {len(files)} JSON files')
          PY

      - name: Check dashboard hooks exist
        run: |
          grep -q 'panel-dashboard' deploy/canvas.html
          grep -q 'renderDashboard' deploy/js/canvas.js
          grep -q 'lineChart' deploy/js/charts.js
          grep -q 'dash-hang-snatch' deploy/canvas.html
          echo 'Dashboard hooks OK'
