name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/weightlifting-log-3169
      - cursor/training-canvas-anatomy-5c6f
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p deploy
          cp index.html canvas.html anatomy.html deploy/
          cp -r css js data assets deploy/
          # drop huge optional dual plate if present size is an issue later
          touch deploy/.nojekyll
          ls -la deploy
          ls -la deploy/assets/anatomy | head

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - uses: actions/deploy-pages@v4
        id: deployment
